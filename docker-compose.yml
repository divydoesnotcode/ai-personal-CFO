services:
  postgres:
    image: postgres:16
    container_name: personal-cfo-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_cfo

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_cfo"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: personal-cfo-backend

    env_file:
      - .env

    environment:
      APP_NAME: "AI Personal CFO"
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/personal_cfo
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: ""

    working_dir: /tmp

    command:
      [
        "sh",
        "-c",
        "PYTHONPATH= alembic -c /app/alembic.ini upgrade head && PYTHONPATH=/app uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend --app-dir /app",
      ]

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./data:/app/data
      - ./ml:/app/ml

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: personal-cfo-frontend

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3000"

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
